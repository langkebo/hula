name: Quality Gate

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-quality-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-quality-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ratchet Guard
        run: pnpm check:ratchet

      - name: Lint
        run: pnpm lint

      - name: Dead Code Detection (knip)
        run: pnpm knip

      - name: Type Check
        run: pnpm typecheck

      - name: Boundary Checks
        run: |
          pnpm check:sdk-types
          pnpm check:sdk-aliases
          pnpm check:v-html
          pnpm check:doc-coverage
          pnpm check:sdk-boundary
          pnpm check:bare-matrix-paths
          pnpm check:icon-colors
          pnpm check:guard-patterns
          pnpm check:settings-wiring
          pnpm check:component-contracts
          pnpm check:i18n-dead-keys

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: A11y Accessibility Scan
        shell: bash
        run: |
          # 策略（b）：CI 真正启动 Storybook 后再扫描；启动失败即显式失败，绝不静默通过。
          set +e
          pnpm storybook > /tmp/storybook.log 2>&1 &
          STORYBOOK_PID=$!
          trap 'kill "$STORYBOOK_PID" 2>/dev/null || true; wait "$STORYBOOK_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 45); do
            if curl -sf http://localhost:6006 >/dev/null 2>&1; then
              echo "Storybook 就绪"
              READY=1
              break
            fi
            echo "等待 Storybook 就绪 ($i/45)..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Storybook 未在 90s 内就绪，a11y 扫描无法执行"
            tail -n 50 /tmp/storybook.log || true
            exit 1
          fi

          # 运行 axe-core 扫描（未就绪时脚本自身 exit 2，不会假装绿）
          pnpm check:a11y --url "$STORYBOOK_URL"
          exit $?
        env:
          STORYBOOK_URL: http://localhost:6006

      - name: Stability Contract Tests
        run: pnpm test:contract

      - name: Crypto Health Monitor Tests (Phase 3.4)
        run: pnpm test:crypto-health

      - name: SDK Pin Verification
        continue-on-error: true
        run: pnpm verify:sdk-pin

      - name: Build
        run: pnpm build
