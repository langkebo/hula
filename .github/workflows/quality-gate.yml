name: Quality Gate

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Read SDK pin
        id: sdk-pin
        shell: bash
        run: echo "commit=$(jq -r .sdk_commit meta/sdk-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout matrix-js-sdk (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: langkebo/matrix-js-sdk
          ref: ${{ steps.sdk-pin.outputs.commit }}
          path: matrix-js-sdk

      - name: Create sibling symlink
        shell: bash
        run: ln -sf "$PWD/matrix-js-sdk" "$PWD/../matrix-js-sdk"

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
            matrix-js-sdk/node_modules
          key: ${{ runner.os }}-pnpm-quality-${{ hashFiles('pnpm-lock.yaml', 'matrix-js-sdk/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-quality-

      - name: Install SDK dependencies
        shell: bash
        run: pnpm --dir matrix-js-sdk install --frozen-lockfile

      - name: Build SDK
        shell: bash
        run: pnpm --dir matrix-js-sdk build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ratchet Guard
        run: pnpm check:ratchet

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Boundary Checks
        run: |
          pnpm check:sdk-types
          pnpm check:v-html
          pnpm check:doc-coverage
          pnpm check:sdk-boundary

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Unit Tests
        run: pnpm test:unit

      - name: SDK Pin Verification
        continue-on-error: true
        run: pnpm verify:sdk-pin

      - name: Build
        run: pnpm build
