name: Quality Gate

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-quality-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-quality-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ratchet Guard
        run: pnpm check:ratchet

      - name: Lint
        run: pnpm lint

      - name: Dead Code Detection (knip)
        run: pnpm knip

      - name: Type Check
        run: pnpm typecheck

      - name: Boundary Checks
        run: |
          pnpm check:sdk-types
          pnpm check:sdk-aliases
          pnpm check:v-html
          pnpm check:doc-coverage
          # P1-5④（2026-10-12）：文档路径存在性守护——提取 .rules 中反引号包裹的
          # 仓库路径 token 并校验其存在，防止 AGENTS.md/CLAUDE.md 出现悬空引用。
          pnpm check:doc-paths
          pnpm check:sdk-boundary
          pnpm check:bare-matrix-paths:report
          pnpm quality:no-raw-fetch
          pnpm check:icon-colors
          pnpm check:guard-patterns
          pnpm check:settings-wiring
          pnpm check:component-contracts
          pnpm check:i18n-dead-keys
          # P1-1②（2026-10-12）：800 行红线此前只在脚本层存在、从未接入 CI（EG-04）。
          # 基线见 meta/file-size-baseline.json（棘轮：存量不增长，新增 >400 即红）。
          pnpm check:file-size
          # AR-07b（2026-11-04）：Matrix 服务层 token 收口与调用链棘轮。
          # 基线见 meta/matrix-layering-baseline.json（只可收紧；--update 收紧）。
          pnpm check:matrix-layering

      - name: Upload contract judgment diff (C-1)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: contract-judgment-diff
          path: scripts/contract-judgment-diff.json
          if-no-files-found: warn
          retention-days: 7

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: A11y Accessibility Scan
        shell: bash
        run: |
          # 策略（b）：CI 真正启动 Storybook 后再扫描；启动失败即显式失败，绝不静默通过。
          set +e
          pnpm storybook > /tmp/storybook.log 2>&1 &
          STORYBOOK_PID=$!
          trap 'kill "$STORYBOOK_PID" 2>/dev/null || true; wait "$STORYBOOK_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 45); do
            if curl -sf http://localhost:6006 >/dev/null 2>&1; then
              echo "Storybook 就绪"
              READY=1
              break
            fi
            echo "等待 Storybook 就绪 ($i/45)..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Storybook 未在 90s 内就绪，a11y 扫描无法执行"
            tail -n 50 /tmp/storybook.log || true
            exit 1
          fi

          # 运行 axe-core 扫描（未就绪时脚本自身 exit 2，不会假装绿）
          pnpm check:a11y --url "$STORYBOOK_URL"
          exit $?
        env:
          STORYBOOK_URL: http://localhost:6006

      - name: Stability Contract Tests
        run: pnpm test:contract

      - name: Crypto Health Monitor Tests (Phase 3.4)
        run: pnpm test:crypto-health

      # P1-1③（2026-10-12）：移除 continue-on-error，使 SDK pin 校验真正阻断（EG-02）。
      #
      # 降级策略由脚本内置（显式打印 SKIP banner，非静默通过）：
      #   - Tjg-only CI 无 `../matrix-js-sdk` worktree / 无 `../synapse-rust` sibling，
      #     且未设 TJG_SDK_DIR ⇒ sdk_commit freshness / contract-mirror binding /
      #     route-freshness 三段判据走 SKIP（scripts/verify-sdk-pin.mjs 的三处
      #     `SKIP …` banner，2026-10-14 时在 L336 / L397 / L420；行号会随脚本改动漂移，
      #     以 banner 文本为准）。
      #   - 仍真实执行的判据 = tarball sha256 + `pin.sdk_lib_fingerprint` ↔ 已安装
      #     `node_modules/matrix-js-sdk/lib` 指纹绑定（N-05，fail-closed）⇒ 保证
      #     「pin ↔ tarball ↔ 已安装产物」一致，CI 中该步对核心不变量有效。
      - name: SDK Pin Verification
        run: pnpm verify:sdk-pin

      - name: Build
        run: pnpm build

  # 全量单元套件（2026-10-11 新增）。
  #
  # 背景：在此之前 CI 只跑 `test:contract`（4 个指定文件）与 `test:crypto-health`，
  # **全量套件从未在 CI 执行**，于是 5 个文件、29 个用例长期红着无人知（其中 2 个是
  # 「扫描全仓」类结构守卫恒超时 ⇒ 等于不存在）。见审计报告 §12.2 / §13。
  #
  # 两个判据彼此独立，缺一不可：
  #   ① `pnpm test:run` 的退出码 —— 有任何用例失败即红；
  #   ② `check-unit-suite-floor.mjs` 的基数断言 —— 即使 ① 被绕过/跳过，
  #      仍会因「文件数/用例数低于地板」或「关键目录无覆盖」而红
  #      （防止有人用一行 exclude 把套件悄悄架空）。
  #
  # 并发限流（2026-10-12，spec §14.6-4 / §14.7）：2 vCPU runner 上全量套件默认满载并行，
  # 重型/扫描类用例（扫描全 `src`）会因「环境构建 + transform」争抢而「假红」——
  # 表现为「失败用例耗时接近其 timeout」，单独复跑即通过（同文件耗时差可达 7–17 倍）。
  # 故把 vitest 并发限到 50%，以稳定换速度。
  #
  # 负载伪红甄别步骤（报出「失败文件」时先做，勿直接当缺陷）：
  #   ① 取 artifact `vitest-report` 中的失败文件名与耗时；
  #   ② 本地单独复跑：`pnpm vitest run <失败文件> --no-file-parallelism`（无其他竞争负载）；
  #   ③ 「失败用例耗时 ≈ 其 timeout」且单独复跑通过 ⇒ 负载伪红，不计入缺陷；
  #      单独复跑仍失败 ⇒ 真实失败，按缺陷修。
  #
  # 本地「一次到底」需两条命令（spec §14.6-3）：
  #   `pnpm check:release`（14 判据聚合链）+ `pnpm check:unit-suite`（全量单测 + 套件地板断言）。
  unit-tests:
    name: Unit Tests (full suite)
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-quality-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-quality-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full unit suite
        # 并发限流（spec §14.6-4）：避免 2 vCPU runner 上的负载伪红，详见本 job 头注释。
        # 注意：此处不可写成 `-- --maxWorkers=50%` —— pnpm 会把 `--` 原样透传，
        # 而 vitest 会忽略 `--` 之后的全部参数（限流将静默失效）。
        run: pnpm test:run:report --maxWorkers=50%

      - name: Assert suite floor and directory coverage
        if: always()
        run: node scripts/check-unit-suite-floor.mjs vitest-full-report.json

      - name: Upload vitest report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: vitest-report
          path: vitest-full-report.json
          if-no-files-found: warn
          retention-days: 7

  # 组件交互测试（Storybook + Vitest browser mode，2026-10-12 新增，spec P2.5-6 / TS-05）。
  #
  # 背景：storybook project 在 vitest.config.ts L13 由 `STORYBOOK_TEST === '1'` 显式 gate，
  # 此前从未进入 CI ⇒ stories 的组件交互回归只在本地手动跑，无守门。
  #
  # 独立 job（而非并入 quality）的原因：
  #   ① browser mode 需先下载 chromium 并拉起真实浏览器，与 quality 的静态检查/构建无关；
  #   ② 独立后可与 quality/unit-tests 并行，且失败不会掩盖其他判据（spec 步骤 4）。
  #
  # 本地取证：`STORYBOOK_TEST=1 pnpm test:run`（chromium 需先 `pnpm exec playwright install chromium`）。
  storybook-tests:
    name: Storybook Component Interaction Tests
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-quality-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-quality-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Storybook component interaction tests
        run: STORYBOOK_TEST=1 pnpm test:run
