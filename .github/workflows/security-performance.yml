name: Security Audit & Performance

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点运行

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout matrix-js-sdk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.MATRIX_JS_SDK_REPO || 'langkebo/matrix-js-sdk' }}
          path: _matrix-js-sdk

      - name: Link matrix-js-sdk
        run: ln -sf "$GITHUB_WORKSPACE/_matrix-js-sdk" "$GITHUB_WORKSPACE/../matrix-js-sdk"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK types
        run: cd _matrix-js-sdk && pnpm install --frozen-lockfile && pnpm build:types

      - name: Run npm audit
        run: pnpm audit:deps
        continue-on-error: true

      - name: Run Rust cargo audit
        if: hashFiles('src-tauri/Cargo.lock') != ''
        uses: rustsec/audit-check@v2
        with:
          working-directory: src-tauri

      - name: Run CodeQL
        uses: github/codeql-action/init@df409f7d9260372bd5f19e5b04e83cb3c43714ae
        with:
          languages: javascript
          queries: security-and-quality

      - name: Build project
        run: pnpm build
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@df409f7d9260372bd5f19e5b04e83cb3c43714ae
        continue-on-error: true

  performance-metrics:
    name: Performance Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout matrix-js-sdk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.MATRIX_JS_SDK_REPO || 'langkebo/matrix-js-sdk' }}
          path: _matrix-js-sdk

      - name: Link matrix-js-sdk
        run: ln -sf "$GITHUB_WORKSPACE/_matrix-js-sdk" "$GITHUB_WORKSPACE/../matrix-js-sdk"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK types
        run: cd _matrix-js-sdk && pnpm install --frozen-lockfile && pnpm build:types

      - name: Build project
        run: pnpm build

      - name: Generate bundle metrics
        run: pnpm metrics:bundle

      - name: Enforce bundle budget
        run: BUNDLE_BUDGET_STRICT=1 node scripts/report-bundle-metrics.mjs

      - name: Summarize bundle baseline
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          node --input-type=module <<'EOF' >> $GITHUB_STEP_SUMMARY
          import fs from 'node:fs'

          const metrics = JSON.parse(fs.readFileSync('dist/bundle-metrics.json', 'utf8'))
          console.log(`Total assets: ${metrics.summary.assetCount}`)
          console.log(`JS files: ${metrics.summary.jsCount}`)
          console.log(`CSS files: ${metrics.summary.cssCount}`)
          console.log(`Total size: ${metrics.summary.totalSizeMB}`)
          console.log(`JS over 500KB: ${metrics.largeJavaScriptAssets.length}`)
          EOF
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top Bundle Assets" >> $GITHUB_STEP_SUMMARY
          node --input-type=module <<'EOF' >> $GITHUB_STEP_SUMMARY
          import fs from 'node:fs'

          const metrics = JSON.parse(fs.readFileSync('dist/bundle-metrics.json', 'utf8'))
          for (const asset of metrics.topAssets.slice(0, 5)) {
            console.log(`- ${asset.file}: ${asset.sizeKB}`)
          }
          EOF

      - name: Check for large bundles
        run: |
          echo "## Large Bundle Warning" >> $GITHUB_STEP_SUMMARY
          large_js=$(find dist -name "*.js" -size +1M 2>/dev/null)
          if [ -n "$large_js" ]; then
            echo "Found large JS files (>1MB):" >> $GITHUB_STEP_SUMMARY
            echo "$large_js" >> $GITHUB_STEP_SUMMARY
          else
            echo "No large JS files found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: |
            dist/stats.html
            dist/bundle-metrics.json
          retention-days: 7

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout matrix-js-sdk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.MATRIX_JS_SDK_REPO || 'langkebo/matrix-js-sdk' }}
          path: _matrix-js-sdk

      - name: Link matrix-js-sdk
        run: ln -sf "$GITHUB_WORKSPACE/_matrix-js-sdk" "$GITHUB_WORKSPACE/../matrix-js-sdk"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK types
        run: cd _matrix-js-sdk && pnpm install --frozen-lockfile && pnpm build:types

      - name: Run TypeScript check
        run: pnpm exec vue-tsc --noEmit

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout matrix-js-sdk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.MATRIX_JS_SDK_REPO || 'langkebo/matrix-js-sdk' }}
          path: _matrix-js-sdk

      - name: Link matrix-js-sdk
        run: ln -sf "$GITHUB_WORKSPACE/_matrix-js-sdk" "$GITHUB_WORKSPACE/../matrix-js-sdk"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK types
        run: cd _matrix-js-sdk && pnpm install --frozen-lockfile && pnpm build:types

      - name: Run tests with coverage
        run: pnpm coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  mobile-baseline:
    name: Mobile Render Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout matrix-js-sdk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.MATRIX_JS_SDK_REPO || 'langkebo/matrix-js-sdk' }}
          path: _matrix-js-sdk

      - name: Link matrix-js-sdk
        run: ln -sf "$GITHUB_WORKSPACE/_matrix-js-sdk" "$GITHUB_WORKSPACE/../matrix-js-sdk"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK types
        run: cd _matrix-js-sdk && pnpm install --frozen-lockfile && pnpm build:types

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Mobile Baseline Tests
        run: pnpm exec playwright test e2e/dynamic-flow.spec.ts e2e/mobile-entry-smoke.spec.ts --project=mobile-chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-baseline-report
          path: playwright-report/
          retention-days: 7
