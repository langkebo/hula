name: Release Validation

on:
  push:
    branches: [release/**]
    tags: ['v*']
  pull_request:
    branches: [release/**]
  workflow_dispatch:
    inputs:
      sdk_repo:
        description: 'matrix-js-sdk repository (owner/repo). Leave blank to use vars.MATRIX_JS_SDK_REPO.'
        required: false
        default: ''
      synapse_rust_repo:
        description: 'synapse-rust repository (owner/repo). Leave blank to use vars.SYNAPSE_RUST_REPO.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tarball-validation:
    name: SDK Tarball Release Validation
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Resolve sibling repository slugs
        id: repos
        run: |
          SDK_REPO="${{ github.event.inputs.sdk_repo }}"
          SYNAPSE_REPO="${{ github.event.inputs.synapse_rust_repo }}"
          SDK_REPO="${SDK_REPO:-${{ vars.MATRIX_JS_SDK_REPO }}}"
          SYNAPSE_REPO="${SYNAPSE_REPO:-${{ vars.SYNAPSE_RUST_REPO }}}"
          if [ -z "$SDK_REPO" ]; then
            echo "::error::matrix-js-sdk repo slug not configured. Set vars.MATRIX_JS_SDK_REPO or supply workflow_dispatch input sdk_repo."
            exit 1
          fi
          if [ -z "$SYNAPSE_REPO" ]; then
            echo "::error::synapse-rust repo slug not configured. Set vars.SYNAPSE_RUST_REPO or supply workflow_dispatch input synapse_rust_repo."
            exit 1
          fi
          echo "sdk_repo=$SDK_REPO" >> "$GITHUB_OUTPUT"
          echo "synapse_repo=$SYNAPSE_REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout hula
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hula

      - name: Read pinned commits
        id: pin
        working-directory: hula
        run: |
          SDK_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('meta/sdk-pin.json','utf8')).sdk_commit||'')")
          SYNAPSE_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('meta/sdk-pin.json','utf8')).synapse_rust_commit||'')")
          if [ -z "$SDK_COMMIT" ]; then
            echo "::error::meta/sdk-pin.json has no sdk_commit; run pnpm sdk:pin:refresh on a dev branch first."
            exit 1
          fi
          echo "sdk_commit=$SDK_COMMIT" >> "$GITHUB_OUTPUT"
          echo "synapse_commit=$SYNAPSE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Pinned matrix-js-sdk commit:  $SDK_COMMIT"
          echo "Pinned synapse-rust commit:  ${SYNAPSE_COMMIT:-(none)}"

      - name: Checkout matrix-js-sdk at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repos.outputs.sdk_repo }}
          ref: ${{ steps.pin.outputs.sdk_commit }}
          path: matrix-js-sdk

      - name: Checkout synapse-rust at pinned commit (informational)
        if: steps.pin.outputs.synapse_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repos.outputs.synapse_repo }}
          ref: ${{ steps.pin.outputs.synapse_commit }}
          path: synapse-rust

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Swap SDK to tarball mode
        working-directory: hula
        run: pnpm sdk:pack:apply

      - name: Install against packed tarball
        working-directory: hula
        run: pnpm install --no-frozen-lockfile

      # 🔴 必须显式传入 `TJG_SDK_DIR`（2026-10-12）。
      #
      # 本 job 上面已按 pin 检出两个 sibling（`matrix-js-sdk@pin.sdk_commit`、
      # `synapse-rust@pin.synapse_rust_commit`），但 `verify-sdk-pin` **不会**自己
      # 去找它们——它只认 `TJG_SDK_DIR`（刻意如此：工作区里同时存在 develop 与
      # release 两条 SDK worktree，自动探测会把 develop 的契约镜像误当成 pin 的来源）。
      # 变量不传 ⇒ 脚本打印 `SKIP sdk_commit freshness` / `SKIP contract-mirror binding`
      # 两行 banner 后**照常退出 0**——而它自述「SKIP 不是 pass」。
      #
      # 后果是实打实的：`contract-mirror binding`（把 `pin.synapse_rust_commit` 与
      # SDK worktree 里 `docs/api-contract/generated/index.json` 的 `synapse_rust_commit`
      # 对死）是**唯一**能抓「契约镜像刷新了、pin 忘了刷」这类跨仓漂移的判据。
      # 2026-10-12 实测正是栽在这里：SDK 侧镜像已随后端从 `14f892e3` 走到 `122aaf109`，
      # 而 pin 仍记旧值 —— 本地 `verify:sdk-pin` 判红，release 线却全绿。
      - name: Verify SDK pin
        working-directory: hula
        env:
          TJG_SDK_DIR: ${{ github.workspace }}/matrix-js-sdk
        run: pnpm verify:sdk-pin

      - name: Run release gate chain
        working-directory: hula
        run: pnpm check:release

      # 发布校验必须跑全量单元套件（2026-10-11 新增）。
      # 此前 release/** 分支的校验链只有静态门禁；而 CI 里也没有任何一步跑全量单测，
      # 于是一批既有红灯长期无人知。`check:unit-suite` = 全量套件 + 套件地板/目录覆盖断言。
      - name: Run full unit suite
        working-directory: hula
        run: pnpm check:unit-suite

      - name: Upload SDK tarball artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: matrix-js-sdk-tarball
          path: |
            hula/vendor/matrix-js-sdk.tgz
            hula/meta/sdk-pin.json
          if-no-files-found: warn
          retention-days: 30
