name: Release Validation

on:
  push:
    branches: [release/**]
    tags: ['v*']
  pull_request:
    branches: [release/**]
  workflow_dispatch:
    inputs:
      sdk_repo:
        description: 'matrix-js-sdk repository (owner/repo). Leave blank to use vars.MATRIX_JS_SDK_REPO.'
        required: false
        default: ''
      synapse_rust_repo:
        description: 'synapse-rust repository (owner/repo). Leave blank to use vars.SYNAPSE_RUST_REPO.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tarball-validation:
    name: SDK Tarball Release Validation
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Resolve sibling repository slugs
        id: repos
        run: |
          SDK_REPO="${{ github.event.inputs.sdk_repo }}"
          SYNAPSE_REPO="${{ github.event.inputs.synapse_rust_repo }}"
          SDK_REPO="${SDK_REPO:-${{ vars.MATRIX_JS_SDK_REPO }}}"
          SYNAPSE_REPO="${SYNAPSE_REPO:-${{ vars.SYNAPSE_RUST_REPO }}}"
          if [ -z "$SDK_REPO" ]; then
            echo "::error::matrix-js-sdk repo slug not configured. Set vars.MATRIX_JS_SDK_REPO or supply workflow_dispatch input sdk_repo."
            exit 1
          fi
          if [ -z "$SYNAPSE_REPO" ]; then
            echo "::error::synapse-rust repo slug not configured. Set vars.SYNAPSE_RUST_REPO or supply workflow_dispatch input synapse_rust_repo."
            exit 1
          fi
          echo "sdk_repo=$SDK_REPO" >> "$GITHUB_OUTPUT"
          echo "synapse_repo=$SYNAPSE_REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout hula
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hula

      - name: Read pinned commits
        id: pin
        working-directory: hula
        run: |
          SDK_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('meta/sdk-pin.json','utf8')).sdk_commit||'')")
          SYNAPSE_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('meta/sdk-pin.json','utf8')).synapse_rust_commit||'')")
          if [ -z "$SDK_COMMIT" ]; then
            echo "::error::meta/sdk-pin.json has no sdk_commit; run pnpm sdk:pin:refresh on a dev branch first."
            exit 1
          fi
          echo "sdk_commit=$SDK_COMMIT" >> "$GITHUB_OUTPUT"
          echo "synapse_commit=$SYNAPSE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Pinned matrix-js-sdk commit:  $SDK_COMMIT"
          echo "Pinned synapse-rust commit:  ${SYNAPSE_COMMIT:-(none)}"

      - name: Checkout matrix-js-sdk at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repos.outputs.sdk_repo }}
          ref: ${{ steps.pin.outputs.sdk_commit }}
          path: matrix-js-sdk

      - name: Checkout synapse-rust at pinned commit (informational)
        if: steps.pin.outputs.synapse_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repos.outputs.synapse_repo }}
          ref: ${{ steps.pin.outputs.synapse_commit }}
          path: synapse-rust

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Swap SDK to tarball mode
        working-directory: hula
        run: pnpm sdk:pack:apply

      - name: Install against packed tarball
        working-directory: hula
        run: pnpm install --no-frozen-lockfile

      # 🔴 必须显式传入 `TJG_SDK_DIR`（2026-10-12）。
      #
      # 本 job 上面已按 pin 检出两个 sibling（`matrix-js-sdk@pin.sdk_commit`、
      # `synapse-rust@pin.synapse_rust_commit`），但 `verify-sdk-pin` **不会**自己
      # 去找它们——它只认 `TJG_SDK_DIR`（刻意如此：工作区里同时存在 develop 与
      # release 两条 SDK worktree，自动探测会把 develop 的契约镜像误当成 pin 的来源）。
      # 变量不传 ⇒ 脚本打印 `SKIP sdk_commit freshness` / `SKIP contract-mirror binding`
      # 两行 banner 后**照常退出 0**——而它自述「SKIP 不是 pass」。
      #
      # 后果是实打实的：`contract-mirror binding`（把 `pin.synapse_rust_commit` 与
      # SDK worktree 里 `docs/api-contract/generated/index.json` 的 `synapse_rust_commit`
      # 对死）与 `route-freshness binding`（比对后端 ledger 快照**内容**）是两处能抓
      # 「契约镜像刷新了、pin 忘了刷」这类跨仓漂移的判据，且都只在给了 `TJG_SDK_DIR` /
      # 后端 sibling 时才真跑。
      # 2026-10-12 实测正是栽在这里：SDK 侧镜像已随后端从 `14f892e3` 走到 `122aaf109`，
      # 而 pin 仍记旧值 —— 本地 `verify:sdk-pin` 判红，release 线却全绿。
      # 2026-10-14：`route-freshness` 由「区间内有没有提交碰过 ledger 目录」改为
      # 「两端 ledger 快照内容是否一致」，因此后端纯文档/sidecar 提交不会再误判为落后。
      - name: Verify SDK pin
        working-directory: hula
        env:
          TJG_SDK_DIR: ${{ github.workspace }}/matrix-js-sdk
        run: pnpm verify:sdk-pin

      - name: Run release gate chain
        working-directory: hula
        run: pnpm check:release

      # 发布校验必须跑全量单元套件（2026-10-11 新增）。
      # 此前 release/** 分支的校验链只有静态门禁；而 CI 里也没有任何一步跑全量单测，
      # 于是一批既有红灯长期无人知。`check:unit-suite` = 全量套件 + 套件地板/目录覆盖断言。
      - name: Run full unit suite
        working-directory: hula
        run: pnpm check:unit-suite

      - name: Upload SDK tarball artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: matrix-js-sdk-tarball
          path: |
            hula/vendor/matrix-js-sdk.tgz
            hula/meta/sdk-pin.json
          if-no-files-found: warn
          retention-days: 30

  live-e2e:
    name: Live Homeserver E2E
    runs-on: ubuntu-latest
    # 默认关闭：仅当仓库变量 MATRIX_LIVE_E2E=true 且 secrets 已配置时运行真实 synapse-rust 后端用例。
    # 不用「用例内部 test.skip」代替开关注入门禁：那种跳过在 CI 里是绿色的，
    # 会让人误以为 live 流程已回归。未启用时本 job 在 GitHub UI 显式显示 skipped。
    if: ${{ vars.MATRIX_LIVE_E2E == 'true' }}
    timeout-minutes: 40

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # 变量开了但 secrets 没配 ⇒ 用例会因缺少凭据自行 skip，CI 依然全绿。
      # 这里显式失败，保证「开关打开」等于「真的跑过」。
      - name: Verify live credentials present
        env:
          MATRIX_LIVE_HOMESERVER_URL: ${{ secrets.MATRIX_LIVE_HOMESERVER_URL }}
          MATRIX_LIVE_USERNAME: ${{ secrets.MATRIX_LIVE_USERNAME }}
          MATRIX_LIVE_PASSWORD: ${{ secrets.MATRIX_LIVE_PASSWORD }}
        run: |
          missing=""
          [ -z "$MATRIX_LIVE_HOMESERVER_URL" ] && missing="$missing MATRIX_LIVE_HOMESERVER_URL"
          [ -z "$MATRIX_LIVE_USERNAME" ] && missing="$missing MATRIX_LIVE_USERNAME"
          [ -z "$MATRIX_LIVE_PASSWORD" ] && missing="$missing MATRIX_LIVE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::MATRIX_LIVE_E2E=true 但缺少 secrets:$missing。补齐 secrets 或关闭该变量。"
            exit 1
          fi

      # playwright.config.ts 的 webServer 会以 mobile vite 配置起 5210 端口，
      # 并在设置了 MATRIX_LIVE_HOMESERVER_URL 时自动注入 VITE_HOMESERVER_URL。
      - name: Run live flows
        env:
          MATRIX_LIVE_E2E: '1'
          MATRIX_LIVE_AUTH_STRATEGY: ${{ vars.MATRIX_LIVE_AUTH_STRATEGY || 'password-api' }}
          MATRIX_LIVE_HOMESERVER_URL: ${{ secrets.MATRIX_LIVE_HOMESERVER_URL }}
          MATRIX_LIVE_USERNAME: ${{ secrets.MATRIX_LIVE_USERNAME }}
          MATRIX_LIVE_PASSWORD: ${{ secrets.MATRIX_LIVE_PASSWORD }}
          MATRIX_LIVE_USER_ID: ${{ secrets.MATRIX_LIVE_USER_ID }}
          MATRIX_LIVE_ROOM_ID: ${{ secrets.MATRIX_LIVE_ROOM_ID }}
          MATRIX_LIVE_ROOM_NAME: ${{ secrets.MATRIX_LIVE_ROOM_NAME }}
          MATRIX_LIVE_PEER_USERNAME: ${{ secrets.MATRIX_LIVE_PEER_USERNAME }}
          MATRIX_LIVE_PEER_PASSWORD: ${{ secrets.MATRIX_LIVE_PEER_PASSWORD }}
        run: pnpm test:e2e:live

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: live-e2e-playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 7
