name: SDK Compatibility Check

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sdk-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
            ../matrix-js-sdk/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SDK version
        run: |
          echo "Checking matrix-js-sdk version..."
          npm ls matrix-js-sdk || true
          echo "SDK check completed"

      - name: Run SDK type checks
        run: |
          echo "Running SDK type compatibility checks..."
          pnpm check:sdk-types || true
          echo "Type checks completed"

      - name: TypeScript type check
        run: |
          echo "Running TypeScript type check..."
          pnpm exec vue-tsc --noEmit

      - name: Audit production dependencies
        run: |
          echo "Auditing production dependencies..."
          pnpm audit --production --audit-level=moderate || true
          echo "Audit completed"

      - name: Check for unused dependencies
        run: |
          echo "Checking for unused dependencies..."
          npx depcheck --ignores="@types/*,@tauri-apps/*,@storybook/*" || true
          echo "Dependency check completed"
