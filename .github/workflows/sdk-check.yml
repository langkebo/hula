name: SDK Compatibility Check

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sdk-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Read SDK pin
        id: sdk-pin
        shell: bash
        run: echo "commit=$(jq -r .sdk_commit meta/sdk-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout matrix-js-sdk (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: langkebo/matrix-js-sdk
          ref: ${{ steps.sdk-pin.outputs.commit }}
          path: matrix-js-sdk

      - name: Create sibling symlink
        shell: bash
        run: ln -sf "$PWD/matrix-js-sdk" "$PWD/../matrix-js-sdk"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
            matrix-js-sdk/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install SDK dependencies
        shell: bash
        run: pnpm --dir matrix-js-sdk install --frozen-lockfile

      - name: Build SDK
        shell: bash
        run: pnpm --dir matrix-js-sdk build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SDK version
        run: |
          echo "Checking matrix-js-sdk version..."
          npm ls matrix-js-sdk || true
          echo "SDK check completed"

      - name: Run SDK type checks
        run: |
          echo "Running SDK type compatibility checks..."
          pnpm check:sdk-types || true
          echo "Type checks completed"

      - name: TypeScript type check
        run: |
          echo "Running TypeScript type check..."
          pnpm exec vue-tsc --noEmit

      - name: Audit production dependencies
        run: |
          echo "Auditing production dependencies..."
          pnpm audit --production --audit-level=moderate || true
          echo "Audit completed"

      - name: Check for unused dependencies
        run: |
          echo "Checking for unused dependencies..."
          npx depcheck --ignores="@types/*,@tauri-apps/*,@storybook/*" || true
          echo "Dependency check completed"
