# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy
# and https://rust-lang.github.io/rust-clippy/

name: rust-clippy analyze

on:
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
    paths:
      - '**/*.rs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    # 跳过 Renovate PR
    if: |
      github.actor != 'renovate[bot]' &&
      github.actor != 'renovate-preview[bot]'

    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    defaults:
      run:
        # 仓库根目录没有 Cargo.toml：不指定工作目录时 `cargo clippy` 会直接
        # 报 "could not find `Cargo.toml`"，本 workflow 自引入起就没真正跑过 lint。
        working-directory: src-tauri
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # P1-1⑤（2026-10-12）：`actions-rs/toolchain` 已归档弃用，改用社区维护的
      # `dtolnay/rust-toolchain`（与本仓 release.yml / debug-build.yml 一致）。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      # P1-1⑤（2026-10-12）：移除 continue-on-error，使 clippy 结果真正阻断（EG-06）。
      # 管道默认取最后一个命令（sarif-fmt）的退出码，会吞掉 cargo clippy 的失败；
      # 故用 `set -o pipefail` 让 cargo clippy 的非 0 退出向上传播（否则本步形同虚设）。
      - name: Run rust-clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy \
            --all-features \
            --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
