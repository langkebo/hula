name: Setup HuLa CI Environment
description: Checkout hula + matrix-js-sdk, setup Node.js + pnpm, install dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version
    required: false
    default: '10'
  install-flags:
    description: Extra flags for pnpm install
    required: false
    default: '--frozen-lockfile'
  sdk-repo:
    description: matrix-js-sdk repository (owner/repo)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout hula
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: true

    - name: Checkout matrix-js-sdk
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ inputs.sdk-repo || vars.MATRIX_JS_SDK_REPO || 'langkebo/matrix-js-sdk' }}
        path: _matrix-js-sdk

    - name: Link matrix-js-sdk
      shell: bash
      run: ln -sf "$GITHUB_WORKSPACE/_matrix-js-sdk" "$GITHUB_WORKSPACE/../matrix-js-sdk"

    - name: Setup Node.js
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Cache dependencies
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ${{ env.STORE_PATH }}
          node_modules
          ../matrix-js-sdk/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-flags }}

    - name: Install SDK dependencies
      shell: bash
      run: cd _matrix-js-sdk && pnpm install --frozen-lockfile

    - name: Build SDK types
      shell: bash
      run: cd _matrix-js-sdk && pnpm build:types
