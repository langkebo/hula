<svg xmlns="http://www.w3.org/2000/svg" width="958" height="734" viewBox="0 0 958 734">
  <style>
    .label { font: 600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #111827; }
    .caption { font: 500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #374151; }
    .a { fill: rgba(59,130,246,0.12); stroke: #2563eb; }
    .b { fill: rgba(16,185,129,0.12); stroke: #059669; }
    .c { fill: rgba(245,158,11,0.12); stroke: #d97706; }
    rect { stroke-width: 2; rx: 12; ry: 12; }
  </style>
  <rect class="a" x="0" y="0" width="958" height="148" />
  <text class="label" x="20" y="34">A. Header</text>
  <text class="caption" x="20" y="56">Title, counters, primary actions</text>
  <rect class="b" x="0" y="148" width="958" height="90" />
  <text class="label" x="20" y="182">B. Search And Filter</text>
  <text class="caption" x="20" y="204">Search box, chips, filter feedback</text>
  <rect class="c" x="0" y="238" width="958" height="496" />
  <text class="label" x="20" y="272">C. Session List</text>
  <text class="caption" x="20" y="294">Item height, radius, hover, active, badge layout</text>
</svg>